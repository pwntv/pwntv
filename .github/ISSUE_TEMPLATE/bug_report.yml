name: Bug report
description: Something in PwnTV isn't working as expected
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Boot PwnTV
        2. Press ... on the gamepad
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include logs or screenshots if you have them.
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Hardware
      placeholder: "e.g. Raspberry Pi 5, 8BitDo SN30 Pro, Samsung TV via HDMI"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: PwnTV version
      placeholder: "e.g. 0.3.1 or commit hash"
    validations:
      required: true
